rule: 'block when a later commit of the range reverts the commit (its message says "This reverts commit <hash>", or its subject is Revert "<the commit''s subject>"), or when a function of a non-test .go file that the commit added, changed or deleted (a declaration holding a line of its -U0 diff, on either side, matched by file and receiver.name; a function literal in a package-level variable counts as that variable) is changed again within the next 20 first-parent commits by a commit whose subject starts with fix or revert (fix, fixes, fixed, fixup, revert, reverts, ...: case-insensitive, a Conventional Commits scope allowed); otherwise allow. Weak and objective: a fix may be unrelated to the change, and a bad change nobody fixed reads as allow.'
