rule: "none: hand-drafted judgments awaiting the user's confirmation (provenance proposed), made by reading each diff against the replay's findings as calibration/notes/field-adjudication-2026-10-13.md did. A failed commit is block when it introduced something a careful reviewer would ask to fix before merging, or that measurably makes a package harder to maintain, and one of the gate's findings names it; allow otherwise. Each reason starts with the cause (real, or for allow boilerplate-dup, covered-export, over-ceiling-growth, tiny-ratchet, no-baseline, double-report, immutable-global or other) and ends with file:line evidence; the per-finding causes are in <name>-hand-notes.md. A stratified sample of passed commits that touched a package was read too and is block only where the gate missed a regression of a kind it claims to catch; the other passed commits were not read and are allow by assumption, which their reason says. agent follows the Co-Authored-By and author rule of calibration/corpus-commits.yaml."
