name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Every setup-go step states its caching explicitly: the module cache and
  # the build cache are restored under a key on go.sum. setup-go@v6 caches
  # by default; spelling it out keeps a later edit from dropping it silently.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # actionlint runs before setup-go so a workflow error (an unknown input,
      # a bad expression, a missing action version) fails before any Go step.
      # ACTIONLINT_SHA256 is the trust anchor: the archive is checked against
      # it before it is unpacked, so nothing fetched at run time executes
      # unverified. The release's actionlint_<version>_checksums.txt is also
      # fetched and its linux_amd64 line compared with the pinned value first,
      # so a version bumped without its checksum fails with both values named
      # instead of a bare sha256sum mismatch. A tampered checksums.txt cannot
      # loosen the pin, since the pinned value still gates execution.
      # To bump: set ACTIONLINT_VERSION, then copy the linux_amd64 line's hash
      # from that release's actionlint_<version>_checksums.txt into
      # ACTIONLINT_SHA256.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          sums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl -fsSL -o "$RUNNER_TEMP/$sums" "$base/$sums"
          published="$(awk -v f="$archive" '$2 == f { print $1 }' "$RUNNER_TEMP/$sums")"
          if [ "$published" != "$ACTIONLINT_SHA256" ]; then
            echo "::error::actionlint v${ACTIONLINT_VERSION}: pinned ACTIONLINT_SHA256 ${ACTIONLINT_SHA256} does not match ${published:-<no entry>} for ${archive} in ${sums}; update ACTIONLINT_SHA256 from that file"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # go mod tidy -diff exits non-zero and prints the diff when go.mod or
      # go.sum drift from the imports, such as a direct import still marked
      # indirect.
      - name: go mod tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint-action caches its own analysis results by default; the
      # module and build caches above come from setup-go.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

      # Same split as the Makefile's test target: calibration/collect runs
      # with GOMAXPROCS=1 to keep an upstream go/types race out of the gate
      # (calibration/notes/go-types-race-2026-09-27.md).
      - name: go test
        run: |
          pkgs="$(go list ./... | grep -v '/calibration/collect$')"
          # shellcheck disable=SC2086 # one import path per word
          go test -race $pkgs
          GOMAXPROCS=1 go test -race ./calibration/collect/

      # The release build embeds only the grammars named by BUILD_TAGS in
      # the Makefile. A tag that drifts from gotreesitter's names still
      # compiles but drops the grammar, so the TypeScript tests fail here.
      - name: go test (grammar subset tags)
        run: make test-subset

      # The README's sample outputs are generated from the fixtures by
      # scripts/readme-samples.sh; this fails with a diff when they drift
      # from what the CLI prints.
      - name: README samples
        run: make readme-check

  # selfcheck gates this repository with its own action built from source,
  # so a change to astimate is judged by the astimate it ships (SPEC.md 14,
  # M3); `make selfcheck` is the local equivalent. On a pull request it
  # checks the packages changed since the merge-base with the base branch;
  # on a push to master it checks every package against the commit master
  # pointed at before the push, or against HEAD itself when that commit is
  # not in the clone (a force push). Exit 3 (a violation) and exit 2
  # (analysis failed) fail the job; warnings annotate and pass. fetch-depth 0
  # puts the merge-base and the previous master tip in the clone.
  selfcheck:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: choose baseline
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            echo "ref=origin/${BASE_REF}" >>"$GITHUB_OUTPUT"
            echo "all=false" >>"$GITHUB_OUTPUT"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "ref=${BEFORE}" >>"$GITHUB_OUTPUT"
            echo "all=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice title=astimate::previous master ${BEFORE} is not in the clone; judging every package against HEAD"
            echo "ref=HEAD" >>"$GITHUB_OUTPUT"
            echo "all=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: ./action
        with:
          version: source
          path: .
          base: ${{ steps.baseline.outputs.ref }}
          all: ${{ steps.baseline.outputs.all }}

  # release-snapshot builds the release with goreleaser without publishing
  # it and checks the assets against the names action/install.sh downloads.
  release-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: check release assets
        run: |
          ls dist
          version="$(jq -r .version dist/metadata.json)"
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            asset="astimate_${version}_${platform}.tar.gz"
            test -f "dist/$asset" || { echo "missing dist/$asset"; exit 1; }
            grep -qx "[0-9a-f]\{64\}  $asset" dist/checksums.txt ||
              { echo "no checksum line for $asset"; exit 1; }
            tar -tzf "dist/$asset" | grep -qx astimate ||
              { echo "$asset has no astimate at its root"; exit 1; }
          done
