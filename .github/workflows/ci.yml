name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Every setup-go step states its caching explicitly: the module cache and
  # the build cache are restored under a key on go.sum. setup-go@v6 caches
  # by default; spelling it out keeps a later edit from dropping it silently.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint-action caches its own analysis results by default; the
      # module and build caches above come from setup-go.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: go test
        run: go test -race ./...

  # gate runs this repository's own action on pull requests, built from
  # source until a release exists. fetch-depth 0 gives the full history so
  # the merge-base of the pull request's merge commit and the base branch
  # exists; the explicit fetch makes sure origin/<base> is present.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - uses: ./action
        with:
          version: source
          base: origin/${{ github.base_ref }}

  # release-snapshot builds the release with goreleaser without publishing
  # it and checks the assets against the names action/install.sh downloads.
  release-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: check release assets
        run: |
          ls dist
          version="$(jq -r .version dist/metadata.json)"
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            asset="astimate_${version}_${platform}.tar.gz"
            test -f "dist/$asset" || { echo "missing dist/$asset"; exit 1; }
            grep -qx "[0-9a-f]\{64\}  $asset" dist/checksums.txt ||
              { echo "no checksum line for $asset"; exit 1; }
            tar -tzf "dist/$asset" | grep -qx astimate ||
              { echo "$asset has no astimate at its root"; exit 1; }
          done
