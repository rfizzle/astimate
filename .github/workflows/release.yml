name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # goreleaser builds the archives and checksums.txt that action/install.sh
  # downloads and publishes them to the GitHub release for the tag. The full
  # history is needed for the changelog.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # No cache: a published binary is built from a clean module and build
      # cache, never from state restored from an earlier run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
