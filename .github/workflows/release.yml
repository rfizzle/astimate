name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # goreleaser builds the archives and checksums.txt that action/install.sh
  # downloads and publishes them to the GitHub release for the tag. The full
  # history is needed for the changelog.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No cache: a published binary is built from a clean module and build
      # cache, never from state restored from an earlier run.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
