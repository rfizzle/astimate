name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # goreleaser builds the archives and checksums.txt that action/install.sh
  # downloads and publishes them to the GitHub release for the tag. The full
  # history is needed for the changelog.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No cache: a published binary is built from a clean module and build
      # cache, never from state restored from an earlier run.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
          cache: false

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
