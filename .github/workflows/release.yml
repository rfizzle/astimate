name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # goreleaser builds the archives and checksums.txt that action/install.sh
  # downloads and publishes them to the GitHub release for the tag. The full
  # history is needed for the changelog.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # No cache: a published binary is built from a clean module and build
      # cache, never from state restored from an earlier run.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
          cache: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
